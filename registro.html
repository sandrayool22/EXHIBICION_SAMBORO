<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwRpTmQAVHsZsWtVGFpG1FOzcz0wbJxV6y8qgYCNNq0HC10_XWrnCdFH0gFw1Hb-yuY/exec";
    
    const CRITERIOS = [
      "1. ¿Exhibidor limpio y en buen estado?",
      "2. ¿Precios y rotulación visibles y correctos?",
      "3. ¿Muestras completas y bien colocadas?"
    ];

    const fotosBase64 = {};

    document.addEventListener('DOMContentLoaded', () => {
      const usuarioGuardado = localStorage.getItem('usuarioSamboro');
      if (!usuarioGuardado) {
        window.location.href = 'index.html';
        return;
      }

      const usuario = JSON.parse(usuarioGuardado);
      document.getElementById('txtTienda').innerText = usuario.tienda || "Samboro";
      document.getElementById('txtUsuario').innerText = usuario.codigo;
      document.getElementById('txtRol').innerText = usuario.rol;

      const container = document.getElementById('dynamicFamiliesContainer');
      const subfamilias = usuario.subfamilias ? usuario.subfamilias.split(',') : [];

      if (subfamilias.length === 0) {
        container.innerHTML = "<p style='text-align:center;'>No tienes subfamilias asignadas.</p>";
        document.getElementById('btnSubmit').style.display = 'none';
        return;
      }

      subfamilias.forEach((sub, subIdx) => {
        const subName = sub.trim();
        const card = document.createElement('div');
        card.className = 'family-card';
        
        let htmlCriterios = '';
        CRITERIOS.forEach((crit, critIdx) => {
          const fieldName = `criterio_${subIdx}_${critIdx}`;
          htmlCriterios += `
            <div class="criterio-box">
              <span class="criterio-title">${crit}</span>
              <div class="options-group">
                <label><input type="radio" name="${fieldName}" value="CUMPLE" required> Cumple</label>
                <label><input type="radio" name="${fieldName}" value="NO CUMPLE" required> No Cumple</label>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="family-title">📌 Subfamilia: ${subName}</div>
          ${htmlCriterios}
          <div class="form-group">
            <label style="font-size:0.8rem; font-weight:700;">Observación / Hallazgo (${subName})</label>
            <textarea id="obs_${subIdx}" rows="2" placeholder="Detalle adicional sobre ${subName}..." required></textarea>
          </div>
          <div class="form-group">
            <label style="font-size:0.8rem; font-weight:700;">Evidencia Fotográfica (${subName})</label>
            <div class="file-container" onclick="document.getElementById('foto_${subIdx}').click()">
              <span id="label_foto_${subIdx}">📷 Subir / Tomar foto para ${subName}</span>
              <input type="file" id="foto_${subIdx}" accept="image/*" capture="environment" style="display:none;" onchange="convertirFoto(${subIdx})">
              <img id="prev_${subIdx}" class="preview-img" alt="Vista previa">
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    });

    // Procesa y comprime la foto para evitar sobrecargar la petición HTTP
    window.convertirFoto = function(subIdx) {
      const fileInput = document.getElementById(`foto_${subIdx}`);
      const file = fileInput.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800;
            const scaleFactor = MAX_WIDTH / img.width;
            
            canvas.width = (img.width > MAX_WIDTH) ? MAX_WIDTH : img.width;
            canvas.height = (img.width > MAX_WIDTH) ? img.height * scaleFactor : img.height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
            fotosBase64[subIdx] = dataUrl.split(',')[1];

            const imgPreview = document.getElementById(`prev_${subIdx}`);
            imgPreview.src = dataUrl;
            imgPreview.style.display = 'block';
            document.getElementById(`label_foto_${subIdx}`).innerText = "Cambiar fotografía";
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    };

    document.getElementById('bitacoraForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const usuario = JSON.parse(localStorage.getItem('usuarioSamboro'));
      const subfamilias = usuario.subfamilias ? usuario.subfamilias.split(',') : [];
      const evaluaciones = [];

      subfamilias.forEach((sub, subIdx) => {
        const subName = sub.trim();
        evaluaciones.push({
          subfamilia: subName,
          criterio1: document.querySelector(`input[name="criterio_${subIdx}_0"]:checked`).value,
          criterio2: document.querySelector(`input[name="criterio_${subIdx}_1"]:checked`).value,
          criterio3: document.querySelector(`input[name="criterio_${subIdx}_2"]:checked`).value,
          observacion: document.getElementById(`obs_${subIdx}`).value.trim(),
          fotoBase64: fotosBase64[subIdx] || ""
        });
      });

      const btnSubmit = document.getElementById('btnSubmit');
      const statusMsg = document.getElementById('statusMsg');

      btnSubmit.disabled = true;
      btnSubmit.innerText = "Guardando...";
      statusMsg.style.display = 'none';

      const payload = {
        action: "guardarBitacoraMasiva",
        usuario: usuario.codigo,
        correo: usuario.correo,
        tienda: usuario.tienda,
        evaluaciones: evaluaciones
      };

      // Envío usando FormData evita bloqueos CORS y fallos de lectura en Apps Script
      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        btnSubmit.disabled = false;
        btnSubmit.innerText = "Enviar Evaluación Completa";

        if (data.success) {
          statusMsg.className = "status-msg success";
          statusMsg.innerText = "¡Evaluación guardada con éxito!";
          statusMsg.style.display = 'block';
          
          document.getElementById('bitacoraForm').reset();
          document.querySelectorAll('.preview-img').forEach(img => img.style.display = 'none');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          statusMsg.className = "status-msg error";
          statusMsg.innerText = data.message || "Error al guardar.";
          statusMsg.style.display = 'block';
        }
      })
      .catch(err => {
        btnSubmit.disabled = false;
        btnSubmit.innerText = "Enviar Evaluación Completa";
        statusMsg.className = "status-msg error";
        statusMsg.innerText = "Error de conexión o timeout al enviar imágenes.";
        statusMsg.style.display = 'block';
      });
    });

    document.getElementById('btnLogout').addEventListener('click', () => {
      localStorage.removeItem('usuarioSamboro');
      window.location.href = 'index.html';
    });
  </script>
